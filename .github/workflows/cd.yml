name: Continuous Delivery

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version and image name
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$REPO" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            .

      - name: Push
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.meta.outputs.image }}:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging
        run: |
          IMAGE=${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker pull "$IMAGE"
          docker rm -f mlops-api || true
          docker run -d --name mlops-api -p 5000:5000 "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && break
            sleep 2
          done
          curl -fs http://localhost:5000/health | tee out.json
          echo
          grep -q '"status": *"healthy"' out.json
          grep -q '"application_version": *"${{ needs.build.outputs.version }}"' out.json
          echo "Smoke test passed for version ${{ needs.build.outputs.version }}"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy production
        run: |
          IMAGE=${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker pull "$IMAGE"
          docker rm -f mlops-api || true
          docker run -d --name mlops-api -p 5000:5000 "$IMAGE"
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && break
            sleep 2
          done
          echo
          echo "Production now serving ${{ needs.build.outputs.version }}"
